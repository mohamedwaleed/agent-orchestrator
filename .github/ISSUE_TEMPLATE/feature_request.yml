name: Feature request
description: Suggest an idea or improvement for the orchestrator
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What are you currently unable to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen instead? Be as specific as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — links to related issues, sketches, etc.
